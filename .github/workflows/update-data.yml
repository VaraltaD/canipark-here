name: Update parking data

permissions:
  contents: write
  
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: pip install -r data/requirements.txt

      - name: Fetch latest city data
        run: python data/fetch.py

      - name: Show sample rows
        run: python data/parse_rtp.py --sample 6
        
      - name: Rebuild signs.json
        run: python data/parse_rtp.py

      - name: Commit if changed
        run: |
          git config user.name "canipark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/signs.json
          if git diff --cached --quiet; then
            echo "No changes to signs.json today."
          else
            git commit -m "chore: refresh parking sign data $(date -u +%Y-%m-%d)"
            git push
          fi
